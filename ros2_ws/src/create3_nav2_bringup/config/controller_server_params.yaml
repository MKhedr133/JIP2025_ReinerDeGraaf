controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: odom

    # Goal / progress checkers (simple, reliable)
    goal_checker_plugins: ["goal_checker"]
    current_goal_checker: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    progress_checker_plugins: ["progress_checker"]
    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Velocity limits (gentle for Create3)
      min_vel_x: 0.0
      max_vel_x: 0.25
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_vel_theta: 0.0
      max_vel_theta: 2.5

      # Accels / decels
      acc_lim_x: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -1.5
      decel_lim_theta: -3.0

      # Trajectory sampling / sim
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.0
      time_granularity: 0.1

      transform_tolerance: 0.3
      short_circuit_trajectory_evaluation: false

      # Critics (simple, proven)
      critics:
        - RotateToGoal
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      PathAlign.scale: 32.0
      GoalAlign.scale: 12.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      ObstacleFootprint.scale: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      publish_frequency: 5.0
      update_frequency: 10.0
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          expected_update_rate: 0.0
          max_obstacle_height: 0.5
          min_obstacle_height: 0.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

      # ✅ Use radius only (no polygon footprint anywhere)
      robot_radius: 0.17
