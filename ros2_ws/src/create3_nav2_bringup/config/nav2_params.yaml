controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: "/odometry/filtered"

    # Goal / progress checkers
    goal_checker_plugins: ["goal_checker"]
    current_goal_checker: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    progress_checker_plugins: ["progress_checker"]
    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Velocity limits (gentle for Create3)
      min_vel_x: 0.0
      max_vel_x: 0.10
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_vel_theta: 0.0
      max_vel_theta: 1.0

      # Accels / decels
      acc_lim_x: 0.9
      acc_lim_theta: 1.0
      decel_lim_x: -0.9
      decel_lim_theta: -2.0

      # Trajectory sampling / sim
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.0
      time_granularity: 0.1
      transform_tolerance: 0.3
      short_circuit_trajectory_evaluation: false

      # Critics (simple, proven)
      critics:
        - RotateToGoal
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      PathAlign:
        scale: 32.0
      GoalAlign:
        scale: 12.0
      PathDist:
        scale: 32.0
      GoalDist:
        scale: 24.0
      RotateToGoal:
        scale: 32.0
      ObstacleFootprint:
        scale: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      publish_frequency: 5.0
      update_frequency: 10.0
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          expected_update_rate: 0.0
          max_obstacle_height: 0.5
          min_obstacle_height: 0.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.3

      # Use radius only
      robot_radius: 0.17

bt_navigator:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/odometry/filtered"
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    bt_loop_duration: 20   # integer milliseconds

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: "/local_costmap/costmap_raw"
    footprint_topic: "/local_costmap/footprint"

    # Humble expects 'recovery_plugins'
    recovery_plugins: ["spin", "wait", "backup"]

    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      time_allowance: 10.0
      max_rotational_vel: 2.5
      min_rotational_vel: 0.5
      angular_dist_threshold: 0.25

    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 5.0

    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      time_allowance: 8.0
      backup_vel: -0.15
      backup_dist: 0.25

planner_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/odometry/filtered"
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 1.0
      update_frequency: 1.0
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          expected_update_rate: 0.0
          max_obstacle_height: 0.5
          min_obstacle_height: 0.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      # Use radius only
      robot_radius: 0.17
