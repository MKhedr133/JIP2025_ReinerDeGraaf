# ==========================================
# Nav2 Parameters (ROS 2 Humble + Nav2 1.x)
# ==========================================

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    update_min_d: 0.05
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 0.2
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /work/config/maps/create3_map.yaml

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.40
      max_vel_theta: 1.2
      acc_lim_x: 0.7
      acc_lim_theta: 1.5
      decel_lim_x: -0.7
      decel_lim_theta: -1.5
      vx_samples: 20
      vtheta_samples: 40
      sim_time: 1.5
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.10
      transform_tolerance: 0.2

  # ---------- Local Costmap ----------
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      robot_radius: 0.20
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.4
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

# ---------- Global Costmap ----------
global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 2.0
    publish_frequency: 2.0
    resolution: 0.05
    robot_radius: 0.20
    track_unknown_space: true
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: lidar
      lidar:
        topic: /scan
        data_type: LaserScan
        clearing: true
        marking: true
        max_obstacle_height: 0.4
        obstacle_max_range: 3.5
        raytrace_max_range: 4.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.6
      cost_scaling_factor: 3.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    enable_groot_monitoring: false
    plugin_lib_names: ["nav2_compute_path_to_pose_action_bt_node",
                       "nav2_follow_path_action_bt_node",
                       "nav2_reinitialize_global_localization_service_bt_node",
                       "nav2_clear_costmap_service_bt_node"]

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true

lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: [
      "map_server",
      "amcl",
      "planner_server",
      "controller_server",
      "smoother_server",
      "bt_navigator",
      "behavior_server",
      "waypoint_follower"
    ]
