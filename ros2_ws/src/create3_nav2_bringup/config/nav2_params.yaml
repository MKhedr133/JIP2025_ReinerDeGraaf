controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    odom_topic: "/odometry/filtered"

    # Goal / progress checkers
    goal_checker_plugins: ["goal_checker"]
    current_goal_checker: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35

    progress_checker_plugins: ["progress_checker"]
    current_progress_checker: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    # Local planner (Regulated Pure Pursuit)
    controller_plugins: ["RPP"]
    RPP:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      desired_linear_vel: 0.10
      max_linear_accel: 0.9
      max_linear_decel: 0.9

      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.75
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      use_cost_regulated_linear_velocity: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 2.0

      allow_reversing: false
      use_rotate_to_heading: true

      # Safety: forward collision projection
      use_collision_detection: true
      collision_checking_time: 2.0
      collision_checking_radius: 0.40

planner_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "/odometry/filtered"
    expected_planner_frequency: 1.0

    planner_plugins: ["Smac2D"]
    Smac2D:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      # Choose ONE: polygon footprint OR robot_radius
      robot_radius: 0.20

      transform_tolerance: 0.50
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3.0
      height: 3.0
      resolution: 0.05
      publish_frequency: 5.0
      update_frequency: 10.0
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        obstacle_range: 2.5
        raytrace_range: 3.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.5
        inflation_radius: 0.70

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      # Choose ONE: polygon footprint OR robot_radius
      robot_radius: 0.20

      transform_tolerance: 0.50
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 1.0
      update_frequency: 1.0
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        obstacle_range: 2.5
        raytrace_range: 3.0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.5
        inflation_radius: 0.80

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: "local_costmap/costmap_raw"
    global_costmap_topic: "global_costmap/costmap_raw"
    local_footprint_topic: "local_costmap/published_footprint"
    global_footprint_topic: "global_costmap/published_footprint"

    recovery_plugins: ["spin", "wait", "backup"]

    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      time_allowance: 10.0
      max_rotational_vel: 2.5
      min_rotational_vel: 0.5
      angular_dist_threshold: 0.25

    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 5.0

    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      time_allowance: 8.0
      backup_vel: -0.15
      backup_dist: 0.25


