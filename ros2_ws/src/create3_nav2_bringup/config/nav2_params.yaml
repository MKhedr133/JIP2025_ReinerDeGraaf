bt_navigator:
  ros__parameters:
    use_sim_time: false

    # Point to BT XMLs that exist on Humble:
    default_bt_xml_filename: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    # Load the BT plugins that define RecoveryNode, PipelineSequence, etc.
    plugin_lib_names:
      # actions / tasks
      - nav2_compute_path_to_pose_bt_node
      - nav2_compute_path_through_poses_bt_node
      - nav2_follow_path_bt_node
      - nav2_smooth_path_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_spin_bt_node
      - nav2_wait_bt_node
      - nav2_back_up_bt_node
      # conditions / controllers
      - nav2_goal_reached_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_transform_available_condition_bt_node
      # selectors
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      # servers
      - nav2_controller_server_action_bt_node
      - nav2_planner_server_action_bt_node
      - nav2_smoother_server_action_bt_node
      # control nodes (REQUIRED for your XMLs)
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node
      - nav2_recovery_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.25
      max_vel_theta: 1.0
      acc_lim_x: 0.5
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      vx_samples: 10
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      critics: ["ObstacleFootprint", "PathAlign", "PathDist", "GoalAlign", "GoalDist"]
      ObstacleFootprint.scale: 0.01
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_subscribe_transient_local: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_angular_norm: 2.0
      max_deviation: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 2.0
    publish_frequency: 2.0
    resolution: 0.05
    rolling_window: false
    width: 50.0
    height: 50.0
    origin_x: 0.0
    origin_y: 0.0
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.60
      cost_scaling_factor: 3.0
    robot_radius: 0.18

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 10.0
    publish_frequency: 10.0
    rolling_window: true
    width: 4.0
    height: 4.0
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        inf_is_valid: true
        clearing: true
        marking: true
        obstacle_range: 3.5
        raytrace_range: 4.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.70
      cost_scaling_factor: 3.0
    robot_radius: 0.18

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - smoother_server
      - waypoint_follower
