state_machine:
  ros__parameters:
    # CPS
    cps_topic: "/scintillator/cps"
    cps_trigger: 20.0
    frame_id: "map"

    # After autonomous_controller publishes STOP, resume patrol?
    resume_patrol_after_sweep: true

    # Nav mode: 'sequential' (NavigateToPose) or 'batch' (NavigateThroughPoses)
    nav_mode: "sequential"

    # Where do waypoints come from?
    #   'generated' → sweep from map YAML/PGM
    #   'yaml'      → load a YAML list of {x,y,theta_deg}
    #   'list'      → use inline list below
    route_source: "generated"

    # If route_source == generated:
    map_yaml: "/work/config/maps/create3_home_map.yaml"
    lane_spacing_m: 1.0
    heading_deg: 0.0

    # If route_source == yaml:
    # map_yaml: "/work/config/routes/route1.yaml"   # file with a YAML LIST of waypoints

    # If route_source == list (inline):
    waypoints:
      - {x: 1.0, y: 0.0, theta_deg: 0.0}
      - {x: 1.0, y: 1.0, theta_deg: 90.0}
      - {x: 0.0, y: 1.0, theta_deg: 180.0}
