amcl:
  ros__parameters:
    use_sim_time: false

    # Frames & topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.4

    # Particle filter
    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    kld_err: 0.05
    kld_z: 0.99

    # Motion model noise (slightly trusting odom)
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.08
    alpha4: 0.08
    alpha5: 0.10

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 4.0
    laser_z_hit: 0.95
    laser_z_rand: 0.05
    laser_z_max: 0.05
    laser_z_short: 0.01
    laser_sigma_hit: 0.20
    laser_likelihood_max_dist: 2.0

    # Update thresholds
    update_min_d: 0.10
    update_min_a: 0.10

    # Beam skip for bad returns
    do_beamskip: true
    beamskip_threshold: 0.3
    beamskip_error_threshold: 0.9
    beamskip_min_beams: 20
