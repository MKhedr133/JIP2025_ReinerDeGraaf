amcl:
  ros__parameters:
    use_sim_time: false

    # Frames & topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan

    # Particle filter settings
    min_particles: 500
    max_particles: 2000
    resample_interval: 1

    # Sensor + motion model noise (tune later)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser limits (match your RPLIDAR config)
    laser_max_range: 4.0
    laser_min_range: 0.05

    # Update thresholds
    update_min_d: 0.05
    update_min_a: 0.05

    # Map settings
    set_initial_pose: false
