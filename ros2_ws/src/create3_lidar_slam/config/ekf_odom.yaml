ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Publish TF from odom -> base_link
    publish_tf: true

    # Inputs
    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: /imu
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true
    
    # Optional niceties
    sensor_timeout: 0.1
    odom0_differential: false
    imu0_differential: false
